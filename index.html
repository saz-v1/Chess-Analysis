<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess.com Game Analyser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="eyebrow">THE ANALYSIS BOARD</div>
            <h1>Chess study.</h1>
            <p>A place to look back at your games.</p>
        </div>

        <div class="search-section" id="searchSection">
            <label class="search-label" for="usernameInput">Find a Chess.com player</label>
            <div class="search-box">
                <input aria-label="Chess.com username" autocomplete="off" spellcheck="false" type="text" id="usernameInput" placeholder="Username">
                <button id="searchBtn">Search Games</button>
            </div>
            <div id="gamesListContainer"></div>
        </div>

        <div class="analyzer-section" id="analyzerSection">
            <div class="review-toolbar">
                <button class="back-button" id="backButton">← Back to Games</button>
                <button id="reviewToggle" aria-expanded="false" aria-controls="reviewColumn">Review &amp; moves</button>
            </div>
            <div class="analyzer-grid">
                <div class="board-container">
                    <div class="player-bar" id="topPlayer"></div>
                    <div class="board-wrapper">
                        <div class="rank-labels" id="rankLabels"></div>
                        <div class="board-and-files">
                            <div id="chessboard"></div>
                            <div class="file-labels" id="fileLabels"></div>
                        </div>
                    </div>
                    <div class="player-bar" id="bottomPlayer"></div>
                    <div class="move-info" id="moveInfo">Move 0: Starting Position</div>
                    <div class="controls">
                        <button id="firstBtn">⇤ First</button>
                        <button id="prevBtn">← Previous</button>
                        <button id="nextBtn">Next →</button>
                        <button id="lastBtn">Last ⇥</button>
                        <button id="flipBtn">Flip board</button>
                        <button id="analyzeBtn" class="analyze-btn">Analyse position</button>
                    </div>
                </div>
                <div class="review-column" id="reviewColumn">
                    <div class="analysis-panel" id="analysisPanel" aria-live="polite"></div>
                    <section class="moves-panel"><h3>Game moves</h3><p>Click a move to jump · ← → to navigate</p><div id="moveList"></div></section>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.12.1/chess.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
